<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Бензак — Война за бензак</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#0e0a07;color:#e8d9b5;font-family:"Trebuchet MS",Arial,sans-serif;overflow:hidden;touch-action:manipulation}
#app{position:relative;margin:0 auto;height:100vh;height:100dvh;max-width:520px;display:flex;flex-direction:column;background:#1a130e}
#top{display:flex;justify-content:space-around;align-items:center;height:46px;flex:none;background:linear-gradient(#3c2a1d,#241710);border-bottom:3px solid #1a0f08;box-shadow:0 2px 8px #000a;font-weight:bold;font-size:14px;color:#cdb68a;text-transform:uppercase;letter-spacing:.5px;z-index:2}
#top b{color:#ffcf6a;font-size:18px;text-shadow:0 0 8px #ff8a1a88}
#cw{flex:1;position:relative;min-height:0}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#bot{display:flex;gap:8px;padding:8px;height:62px;flex:none;background:linear-gradient(#241710,#3c2a1d);border-top:3px solid #1a0f08;box-shadow:0 -2px 8px #000a}
#bot button{flex:1}
button{font:inherit;font-weight:bold;color:#fff0cf;background:linear-gradient(#b8531c,#6e2f10);border:2px solid #e0802f;border-radius:10px;padding:8px 12px;cursor:pointer;text-shadow:0 1px 2px #000a;box-shadow:inset 0 1px 0 #ffffff40,0 3px 0 #3a1708,0 5px 8px #0008}
button:active{transform:translateY(2px);box-shadow:inset 0 1px 0 #ffffff30,0 1px 0 #3a1708}
button:disabled{opacity:.4}
button.alt{background:linear-gradient(#5a4e3e,#322a20);border-color:#9a8764;box-shadow:inset 0 1px 0 #ffffff30,0 3px 0 #17110b,0 5px 8px #0008}
#sheet{position:absolute;left:6px;right:6px;display:none;gap:6px;padding:6px;background:linear-gradient(rgba(58,40,26,.97),rgba(30,20,12,.97));border:2px solid #8a5a30;border-radius:12px;box-shadow:0 6px 16px #000b;flex-wrap:wrap;justify-content:center;font-size:13px;z-index:3}
#sheet .h{width:100%;text-align:center;font-size:13px;color:#e8c98a}
#sheet button{flex:1 1 40%;font-size:13px;padding:7px 4px}
.scr{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 85%,#7a2a0c 0%,#33160a 35%,#120a06 75%);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;z-index:5;overflow:auto}
.scr h1{margin:0;font-size:58px;color:#ffa030;letter-spacing:4px;text-shadow:0 3px 0 #7a2c08,0 6px 0 #3a1204,0 0 30px #ff6a0066;font-family:Impact,'Arial Black',sans-serif}
.scr h2{margin:0;color:#ffb347}
#sMenu{justify-content:flex-start;padding-top:0;gap:10px}
#mHero{width:100%;max-width:520px;flex:1 1 auto;min-height:0;object-fit:cover;object-position:50% 30%;margin:0 -20px;
  -webkit-mask-image:linear-gradient(#000 62%,transparent 100%);mask-image:linear-gradient(#000 62%,transparent 100%)}
#sMenu h1{margin-top:-46px;position:relative;z-index:1}
#sMenu .sub{position:relative;z-index:1}
.scr .sub{color:#c9b48a;margin-top:-6px}
.scr button{min-width:200px;font-size:18px}
#cards{display:grid;grid-template-columns:1fr;gap:8px;width:100%;max-width:400px}
.card{background:linear-gradient(#3a2a1e,#241710);border:2px solid #6b4122;box-shadow:0 3px 8px #0008;border-radius:8px;padding:8px;text-align:left;font-size:14px}
.card b{color:#ffb347}.card i{color:#a8946c}
.card.off{opacity:.6;text-align:center;font-size:20px;color:#7b6a52}

/* ---- металлический интерфейс ---- */
#top{position:relative;background:linear-gradient(#4d3826 0,#2d1d12 55%,#22160e 100%);border-bottom:3px solid #120a05;box-shadow:inset 0 1px 0 #ffffff28,inset 0 -2px 0 #0007,0 3px 10px #000b}
#top::before,#top::after,#bot::before,#bot::after{content:'';position:absolute;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e0cfa8,#76603c 58%,#2a1d10);box-shadow:0 1px 1px #000}
#top::before{left:6px;top:50%;margin-top:-4px}#top::after{right:6px;top:50%;margin-top:-4px}
#top span{display:flex;align-items:center;gap:6px}
#top i,#top em{font-style:normal;color:#9d8a68;font-size:13px}
.ic{width:26px;height:26px;object-fit:contain;flex:none;filter:drop-shadow(0 1px 2px #000)}
#bot{position:relative;background:linear-gradient(#22160e,#3e2b1c 45%,#2d1d12);border-top:3px solid #120a05;box-shadow:inset 0 1px 0 #ffffff20,0 -3px 10px #000b}
#bot::before{left:4px;top:6px}#bot::after{right:4px;top:6px}
button{background:linear-gradient(#cf6422,#85390f 58%,#63290b);border:2px solid #f2a04c;border-radius:9px;box-shadow:inset 0 1px 0 #ffddb050,inset 0 -3px 0 #0003,0 3px 0 #2f1306,0 6px 10px #000a;letter-spacing:.3px}
button.alt{background:linear-gradient(#6b5d49,#3a3226 58%,#2a2319);border-color:#a8946c;box-shadow:inset 0 1px 0 #ffffff38,inset 0 -3px 0 #0004,0 3px 0 #17110b,0 6px 10px #000a}
button:not(:disabled):hover{filter:brightness(1.1)}
#sheet{background:radial-gradient(circle at 9px 9px,#d6c29a 0 2px,#5a4630 3px,transparent 4px),radial-gradient(circle at calc(100% - 9px) 9px,#d6c29a 0 2px,#5a4630 3px,transparent 4px),radial-gradient(circle at 9px calc(100% - 9px),#d6c29a 0 2px,#5a4630 3px,transparent 4px),radial-gradient(circle at calc(100% - 9px) calc(100% - 9px),#d6c29a 0 2px,#5a4630 3px,transparent 4px),linear-gradient(rgba(64,45,30,.98),rgba(30,20,12,.98));border:2px solid #9a6a3a;box-shadow:inset 0 1px 0 #ffffff20,0 8px 18px #000c;padding:12px 14px}
.card{background:linear-gradient(#45321f,#27190f);border-color:#7a4c28}

/* ---- способности и превью волны ---- */
#abil{display:flex;align-items:center;gap:8px;padding:5px 8px;flex:none;min-height:54px;background:linear-gradient(#2a1c12,#201409);border-top:2px solid #120a05;box-shadow:inset 0 1px 0 #ffffff14}
#abbtn{display:flex;gap:7px;flex:none}
.ab{position:relative;width:46px;height:46px;min-width:0!important;padding:0!important;border-radius:50%!important;overflow:hidden;font-size:12px;background:linear-gradient(#5a4a38,#2b2319)!important;border:2px solid #a8946c!important;box-shadow:inset 0 1px 0 #ffffff30,0 2px 0 #120a05,0 4px 8px #000a!important}
.ab img{width:34px;height:34px;object-fit:contain;position:relative;z-index:1;display:block;margin:auto;filter:drop-shadow(0 1px 2px #000a)}
.ab .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(10,6,3,.72);z-index:2;transition:height .15s}
.ab .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:3;font-weight:bold;color:#fff0cf;text-shadow:0 1px 2px #000;font-size:14px}
.ab.rdy{border-color:#ffb347!important;box-shadow:0 0 10px #ff9a2a88,inset 0 1px 0 #ffffff30,0 2px 0 #120a05!important}
.ab.on{border-color:#ff5a3a!important;box-shadow:0 0 14px #ff4a2aaa!important;transform:scale(1.08)}
#nextw{flex:1;display:flex;align-items:center;gap:6px;overflow-x:auto;white-space:nowrap;font-size:13px;color:#cdb68a;min-width:0}
#nextw .nl{color:#9d8a68;flex:none}#nextw .nl.hint{color:#ff9a6a;font-weight:bold}
#nextw .nl b{color:#ffcf6a}
.chip{display:flex;align-items:center;gap:3px;background:#0007;border:1px solid #5a4630;border-radius:8px;padding:1px 6px 1px 3px;flex:none}
.chip.boss{border-color:#ff5a3a;background:#3a0e0699}
.chip img{height:22px;max-width:34px;object-fit:contain}
.chip b{color:#ffcf6a;font-size:13px}
#sheet button small{display:block;font-weight:normal;font-size:11px;color:#f0d9b0;opacity:.9;line-height:1.2;margin-top:2px}

/* ---- текстура металла панелей (assets/ui_panel.jpg) ---- */
#top{background:linear-gradient(rgba(255,235,200,.05),rgba(0,0,0,.5)),var(--panel,linear-gradient(#4d3826,#22160e));background-size:auto,360px}
#bot{background:linear-gradient(rgba(0,0,0,.45),rgba(255,235,200,.04)),var(--panel,linear-gradient(#22160e,#3e2b1c));background-size:auto,360px}
#abil{background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.6)),var(--panel,linear-gradient(#2a1c12,#201409));background-size:auto,360px}

/* ---- звёзды, достижения ---- */
.stars{font-size:30px;color:#ffcf6a;letter-spacing:4px;text-shadow:0 2px 0 #5a3a08,0 0 12px #ff9a2a88}
.stars-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:13px}
.stars-row b{color:#ffcf6a;letter-spacing:1px}
#toast{position:absolute;top:56px;left:50%;transform:translate(-50%,-30px);z-index:20;background:linear-gradient(#5a3a16,#3a230d);border:2px solid #ffb347;border-radius:12px;padding:8px 16px;color:#ffe9b8;font-size:15px;opacity:0;pointer-events:none;box-shadow:0 6px 16px #000b;white-space:nowrap}
#toast b{color:#ffcf6a}
#toast.show{animation:tst 3.4s ease forwards}
@keyframes tst{0%{opacity:0;transform:translate(-50%,-30px)}10%{opacity:1;transform:translate(-50%,0)}85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-20px)}}
</style>
</head>
<body>
<div id="app">
  <div id="toast"></div>
  <div id="top"><span title="Лом"><img class="ic" data-ui="scrap" alt=""><b id="hScrap">100</b></span><span title="Топливо"><img class="ic" data-ui="fuel" alt=""><b id="hFuel">10</b><i>/10</i></span><span title="Волна"><img class="ic" data-ui="skull" alt=""><b id="hWave">0</b><i>/<em id="hWaveMax">12</em></i></span></div>
  <div id="cw"><canvas id="cv"></canvas><div id="sheet"></div></div>
  <div id="abil"><div id="abbtn"><button class="ab" data-a="air" title="Воздушный удар"><img data-ui="air" alt=""><span class="cd"></span><span class="t"></span></button><button class="ab" data-a="rep" title="Ремонт всех башен"><img data-ui="rep" alt=""><span class="cd"></span><span class="t"></span></button><button class="ab" data-a="emp" title="ЭМИ: оглушает врагов"><img data-ui="emp" alt=""><span class="cd"></span><span class="t"></span></button></div><div id="nextw"></div></div>
  <div id="bot"><button id="bWave">Начать волну</button><button id="bSpeed" class="alt" style="flex:.45">×1</button><button id="bMenu" class="alt" style="flex:.6">Меню</button></div>

  <div class="scr" id="sMenu" style="display:flex">
    <img id="mHero" alt="" style="display:none">
    <h1>БЕНЗАК</h1><div class="sub">Война за бензак</div>
    <button id="mPlay">Играть</button>
    <button id="mNew" class="alt" style="display:none">Начать сначала</button>
    <button id="mBook" class="alt">Книга комбо</button>
    <button id="mSet" class="alt">Настройки</button>
    <div id="mStars" class="sub stars-row"></div>
    <button id="mAch" class="alt">Достижения</button>
    <div id="mBest" class="sub"></div>
  </div>
  <div class="scr" id="sAch"><h2>Достижения</h2><div id="achList" style="display:grid;gap:8px;width:100%;max-width:400px"></div><button class="alt" data-back>Назад</button></div>
  <div class="scr" id="sBook"><h2>Книга комбо</h2><div id="cards"></div><button class="alt" data-back>Назад</button></div>
  <div class="scr" id="sSet"><h2>Настройки</h2><button id="tSound">Звук: вкл</button><button class="alt" data-back>Назад</button></div>
  <div class="scr" id="sEnd"><h2 id="eTitle"></h2><div id="eInfo"></div><button id="eNext" style="display:none">Следующая карта</button><button id="eAgain" class="alt">Ещё раз</button><button id="eMenu" class="alt">В меню</button></div>
</div>

<div id="loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#120a06;color:#ffb347;font:bold 20px sans-serif;z-index:99">Загрузка…</div>
<script src="lib/pixi.min.js"></script>
<script src="game.js"></script>
<script>
/* картинка босса на заставке: из встроенных ассетов (Benzak.html) или assets/menu_boss.jpg; нет файла — блок скрыт */
(function(){var h=document.getElementById('mHero'),a=window.__ASSETS;
  h.onload=function(){h.style.display='block';};
  h.src=(a&&a.menu_boss)||'assets/menu_boss.jpg';
  document.documentElement.style.setProperty('--panel','url('+((a&&a.ui_panel)||'assets/ui_panel.jpg')+')');
  document.querySelectorAll('img[data-ui]').forEach(function(i){var n='ui_'+i.dataset.ui;i.src=(a&&a[n])||'assets/'+n+'.png';});})();
</script>
</body>
</html>
